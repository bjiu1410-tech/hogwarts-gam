name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ts-malfoy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ts-malfoy-apk
          path: ts-malfoy.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TS 말포이 빌드 ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            휴대폰에서 아래 ts-malfoy.apk 를 눌러 다운로드 → 설치하세요.
            (처음 설치 시 '출처를 알 수 없는 앱 설치'를 허용해야 합니다)
          files: ts-malfoy.apk
